name: Docs Build Check

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
  pull_request:
    paths:
      - "docs/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install and Build CSS
        working-directory: ./docs
        run: |
          npm ci
          npm run build

      - name: Check build output exists
        run: test -f docs/assets/tailwind.css
